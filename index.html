<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--blue:#0f4c81;--dk:#16202a;--muted:#657386;--bg:#f4f7fb;--card:#fff;--green:#18794e;--red:#b42318;--orange:#b54708;--line:#d8e1ec}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dk)}
header{background:linear-gradient(135deg,#0f4c81,#17324d);color:white;padding:28px 34px} header h1{margin:0 0 6px;font-size:28px} header p{margin:0;opacity:.88}
main{padding:24px 34px 42px;max-width:1260px;margin:auto} .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
button{border:1px solid var(--line);background:white;color:var(--dk);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer} button.active{background:var(--blue);color:white;border-color:var(--blue)}
.grid{display:grid;gap:16px} .kpis{grid-template-columns:repeat(4,minmax(160px,1fr))} .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 9px rgba(18,38,63,.06)}
.kpi .label{color:var(--muted);font-size:13px;margin-bottom:8px} .kpi .value{font-size:30px;font-weight:750} .kpi .sub{color:var(--muted);margin-top:6px;font-size:13px}
.panel-grid{grid-template-columns:1.25fr .75fr;margin-top:16px} table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf1f6;font-size:14px} th{color:#43556c;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eaf2fa;color:var(--blue);font-weight:700;font-size:12px} .good{color:var(--green)} .warn{color:var(--orange)} .bad{color:var(--red)}
.chart{height:270px;display:flex;align-items:flex-end;gap:12px;padding:18px 8px 4px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)} .barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:46px} .bar{width:100%;max-width:62px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#2979b8,#0f4c81);min-height:3px;position:relative} .bar span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;color:#43556c;font-weight:700} .barlabel{font-size:12px;color:var(--muted)}
.note{color:var(--muted);line-height:1.45} pre{background:#0f1720;color:#e6edf3;padding:16px;border-radius:12px;overflow:auto;white-space:pre-wrap}
@media(max-width:900px){.kpis,.panel-grid{grid-template-columns:1fr} header,main{padding-left:18px;padding-right:18px}}
.clipboard-source{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}.agent-copy-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
</style></head><body>
<header><h1>PR to PO KPI</h1><p>Monthly procurement release metrics for USA, Canada, Saudi, and Dubai.</p></header>
<main><div class="controls" id="regionButtons"></div><section id="dashboard"></section>
<section class="card" style="margin-top:16px"><h2>Monthly Update Agent Instructions</h2><p class="note">Use this prompt for the agent that updates this file each month.</p><div class="agent-copy-actions"><button type="button" id="copyAgentInstructionsBtn" onclick="copyAgentInstructions()">Copy Agent Instructions</button><span id="copyAgentInstructionsStatus" class="note" aria-live="polite"></span></div><textarea id="agentInstructionsText" class="clipboard-source" readonly aria-hidden="true" tabindex="-1">You are the PR to PO KPI Data Update Agent.

I need help updating a PR to PO KPI dashboard data file.

Goal:
Create a new dashboard-data.json file that I can upload to GitHub for my PR to PO KPI website.

Important:
Do not create or modify index.html.
Do not redesign the dashboard.
Do not change layout, colors, charts, labels, tables, or JavaScript.
Only create a valid dashboard-data.json file.

I will upload files in stages.

Files involved:
1. Existing dashboard-data.json
2. USA Requisition and Purchase Order Status CSV
3. Canada Requisition and Purchase Order Status CSV
4. Dubai/UAE Requisition and Purchase Order Status CSV
5. Saudi Requisition and Purchase Order Status CSV

CSV files are valid source data.
Do not reject CSV files because they are not Excel workbooks.
If a CSV file is readable, process the CSV rows directly.

PROCESS

Step 1:
Ask me to upload the existing dashboard-data.json file.

After I upload it:
- Read and validate the JSON.
- Confirm that it contains:
- regions
- regions.USA
- regions.Canada
- regions.Dubai
- regions.Saudi
- assumptions

Step 2:
Ask me to upload the USA CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 3:
Ask me to upload the Canada CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 4:
After USA and Canada are uploaded and validated:
- Update only the USA and Canada sections in the base JSON.
- Preserve Dubai and Saudi exactly as they appeared in the original dashboard-data.json.
- Preserve the assumptions array.
- Create an interim JSON output named dashboard-data-USA-Canada.json.
- Return the interim JSON as an attached/downloadable file if possible.
- Then ask me to upload the Dubai/UAE CSV file.

Step 5:
Ask me to upload the Dubai/UAE CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 6:
Ask me to upload the Saudi CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 7:
After Dubai/UAE and Saudi are uploaded and validated:
- Use the interim JSON as the base.
- Preserve USA and Canada exactly as updated in the interim JSON.
- Update only Dubai and Saudi.
- Preserve the assumptions array.
- Create the final valid dashboard-data.json file.
- Return the final dashboard-data.json as an attached/downloadable file if possible.

REQUIRED COLUMNS

Required columns after normalization:
- Project Manager
- Requisition #
- Requisition Status
- Approval State
- Requisition Create Date
- Requisition Submit Date
- Requisition PM Approve Date
- Requisition Buyer Approve Date
- PO #
- PO Date
- PO Status
- PO Currency
- PO Total Amount
- Vendor Number
- Vendor Name

Column normalization rules:
- Remove line breaks in column names.
- Trim leading and trailing spaces.
- Replace multiple spaces with one space.

Examples:
"Requisition 
PM Approve Date" should be treated as "Requisition PM Approve Date"

"Requisition 
Buyer Approve Date" should be treated as "Requisition Buyer Approve Date"

"PO Total Amount" should be treated as "PO Total Amount"

RELEASED PO RULE

Only count rows where:
- PO Status equals Printed
- Requisition PM Approve Date is populated
- Requisition Buyer Approve Date is populated

Do not count rows where PO Status is:
- Cancelled
- Changed
- Approved
- Blank
- Anything other than Printed

DATE AND TIME RULES

The PR/PO source files may contain date-only values instead of date/time values.

If a date field has no time value:
- Treat the date as midnight at the start of that calendar day.
- Still calculate business time based on business calendar days.
- Do not reject the row only because time-of-day is missing.

Business hours are calculated from:
- Requisition PM Approve Date
to:
- Requisition Buyer Approve Date

Use PO Date only for monthly grouping.
Do not use PO Date to calculate buyer delay.

BUSINESS CALENDAR RULES

Calculate business hours using the region-specific weekend and holiday calendar.

Exclude:
- Weekend days for that region
- Public holidays for that region

If the start date and end date are the same business day:
- Business hours may be less than 24
- Delay days should be 0

Delay days = INT(business hours / 24)

Same Day = delay days 0.
Delayed 1+ day = delay days greater than or equal to 1.
Delayed 10-20 days = delay days between 10 and 20 inclusive.
Delayed 20+ days = delay days greater than 20.

Do not convert currencies.
Total PO amount is the reported PO Total Amount sum from the source file.

WEEKEND RULES BY REGION

Use these weekend exclusions:

USA:
- Saturday
- Sunday

Canada:
- Saturday
- Sunday

Dubai:
- Saturday
- Sunday

Saudi:
- Friday
- Saturday

HOLIDAY RULES

Use this holiday priority:

1. If the uploaded base dashboard-data.json already contains a holiday list or configured calendar for a region, use that existing region-specific holiday list.
2. If the base JSON does not contain a holiday list, use the 2026 holiday lists below.
3. Do not invent holidays.
4. Do not add state, provincial, or company holidays unless they already exist in the base JSON or I provide them.

For all holiday matching:
- Treat holiday dates as full non-business days.
- Exclude them from business-hour calculations.
- If a holiday falls on a weekend, do not double count it.
- Count holidays in calendarNote as the number of holiday dates used for that region.

USA 2026 HOLIDAYS

Use these USA holiday dates if no existing USA holiday list is available in the base JSON:

- 2026-01-01 New Year's Day
- 2026-01-19 Martin Luther King Jr. Day
- 2026-02-16 Washington's Birthday / Presidents Day
- 2026-05-25 Memorial Day
- 2026-06-19 Juneteenth National Independence Day
- 2026-07-03 Independence Day observed
- 2026-09-07 Labor Day
- 2026-10-12 Columbus Day
- 2026-11-11 Veterans Day
- 2026-11-26 Thanksgiving Day
- 2026-12-25 Christmas Day

USA calendarNote format:
"Weekends excluded: Sat, Sun; Holidays excluded: 11 dates"

CANADA 2026 HOLIDAYS

Use these Canada holiday dates if no existing Canada holiday list is available in the base JSON:

- 2026-01-01 New Year's Day
- 2026-04-03 Good Friday
- 2026-04-06 Easter Monday
- 2026-05-18 Victoria Day
- 2026-07-01 Canada Day
- 2026-08-03 Civic Holiday
- 2026-09-07 Labour Day
- 2026-09-30 National Day for Truth and Reconciliation
- 2026-10-12 Thanksgiving Day
- 2026-11-11 Remembrance Day
- 2026-12-25 Christmas Day
- 2026-12-26 Boxing Day

Do not include Quebec-only Saint-Jean-Baptiste Day unless the base JSON already includes it or I specifically ask for it.

Canada calendarNote format:
"Weekends excluded: Sat, Sun; Holidays excluded: 12 dates"

DUBAI / UAE 2026 HOLIDAYS

Use these Dubai/UAE holiday dates if no existing Dubai/UAE holiday list is available in the base JSON.

Because some UAE Islamic holiday dates depend on official moon sighting, use the base JSON dates first if available. If no base dates are available, use this 2026 working holiday list:

- 2026-01-01 New Year's Day
- 2026-03-19 Eid Al Fitr holiday
- 2026-03-20 Eid Al Fitr
- 2026-03-21 Eid Al Fitr holiday
- 2026-03-22 Eid Al Fitr holiday
- 2026-05-26 Arafat Day
- 2026-05-27 Eid Al Adha
- 2026-05-28 Eid Al Adha holiday
- 2026-05-29 Eid Al Adha holiday
- 2026-06-15 Islamic New Year
- 2026-08-24 Prophet Muhammad's Birthday observed
- 2026-12-02 UAE National Day
- 2026-12-03 UAE National Day

Dubai calendarNote format:
"Weekends excluded: Sat, Sun; Holidays excluded: 13 dates"

SAUDI 2026 HOLIDAYS

Use these Saudi holiday dates if no existing Saudi holiday list is available in the base JSON.

Because some Saudi Islamic holiday dates depend on official moon sighting, use the base JSON dates first if available. If no base dates are available, use this 2026 working holiday list:

- 2026-02-22 Founding Day
- 2026-03-19 Eid Al Fitr holiday
- 2026-03-20 Eid Al Fitr
- 2026-03-21 Eid Al Fitr holiday
- 2026-03-22 Eid Al Fitr holiday
- 2026-05-26 Arafat Day
- 2026-05-27 Eid Al Adha
- 2026-05-28 Eid Al Adha holiday
- 2026-05-29 Eid Al Adha holiday
- 2026-09-23 Saudi National Day

Do not include Ramadan Begins, Flag Day, Muharram, equinoxes, or solstices as business holidays unless the base JSON already includes them or I specifically provide them.

Saudi calendarNote format:
"Weekends excluded: Fri, Sat; Holidays excluded: 10 



Return only the updated dashboard-data.json file.</textarea></section>
</main>
<script>

function copyAgentInstructions(){
  const source=document.getElementById('agentInstructionsText');
  const status=document.getElementById('copyAgentInstructionsStatus');
  const text=source.value;
  const done=()=>{status.textContent='Copied to clipboard.';setTimeout(()=>{status.textContent=''},2500)};
  const failed=()=>{status.textContent='Copy failed. Select the button again or copy from the source file.'};
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(source,done,failed));
  }else{
    fallbackCopy(source,done,failed);
  }
}
function fallbackCopy(source,done,failed){
  try{
    source.focus();
    source.select();
    source.setSelectionRange(0,source.value.length);
    const ok=document.execCommand('copy');
    window.getSelection().removeAllRanges();
    ok?done():failed();
  }catch(err){
    failed();
  }
}
let DASHBOARD_DATA;
const order=['USA','Canada','Saudi','Dubai']; let current='USA';
function n(v){return Number(v||0)} function fmtNum(v){return n(v).toLocaleString()} function fmtAmt(v){return n(v).toLocaleString(undefined,{maximumFractionDigits:0})} function fmtPct(v){return (n(v)*100).toFixed(1)+'%'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderButtons(){const box=document.getElementById('regionButtons');box.innerHTML='';order.forEach(r=>{const b=document.createElement('button');b.textContent=r;b.className=r===current?'active':'';b.onclick=()=>{current=r;renderButtons();render()};box.appendChild(b)})}
function kpi(label,value,sub,cls=''){return `<div class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`}
function renderChart(months){const max=Math.max(1,...months.map(m=>m.released));return `<div class="chart">${months.map(m=>`<div class="barwrap"><div class="bar" style="height:${Math.max(3,m.released/max*220)}px"><span>${m.released}</span></div><div class="barlabel">${esc(m.month)}</div></div>`).join('')}</div>`}
function renderMonthlyTable(months){return `<table><thead><tr><th>Month</th><th>Released</th><th>Same Day</th><th>Delayed 1+</th><th>10-20</th><th>20+</th><th>Reported Amount</th></tr></thead><tbody>${months.map(m=>`<tr><td>${esc(m.month)}</td><td>${fmtNum(m.released)}</td><td class="good">${fmtNum(m.same_day)}</td><td class="${m.delayed_1?'warn':''}">${fmtNum(m.delayed_1)}</td><td>${fmtNum(m.delayed_10_20)}</td><td class="${m.delayed_20?'bad':''}">${fmtNum(m.delayed_20)}</td><td>${fmtAmt(m.amount)}</td></tr>`).join('')}</tbody></table>`}
function renderDelayed(rows){if(!rows.length)return '<p class="note">No delayed 1+ day PR to PO releases found for this data set.</p>';return `<table><thead><tr><th>Req</th><th>PO</th><th>Vendor</th><th>PM</th><th>Delay Days</th><th>Business Hours</th><th>Amount</th><th>Curr</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.req)}</td><td>${esc(r.po)}</td><td>${esc(r.vendor)}</td><td>${esc(r.manager)}</td><td class="bad">${fmtNum(r.delay)}</td><td>${n(r.hours).toFixed(2)}</td><td>${fmtAmt(r.amount)}</td><td>${esc(r.currency)}</td></tr>`).join('')}</tbody></table>`}
function render(){const region=DASHBOARD_DATA.regions[current];const dash=document.getElementById('dashboard');const m=region.metrics;dash.innerHTML=`<div class="card"><span class="badge">${esc(current)}</span> <span class="note">Source: ${esc(region.fileName)} | Updated: ${esc(region.generatedAt)} | ${esc(region.calendarNote)} | Currencies: ${esc(region.currencyNote)}</span></div><div class="grid kpis" style="margin-top:16px">${kpi('Purchase orders released',fmtNum(m.released),'PO Status = Printed')}${kpi('Same-day release',fmtPct(m.sameDayPct),fmtNum(m.sameDay)+' of '+fmtNum(m.released),'good')}${kpi('Delayed 1+ day',fmtNum(m.delayed1),fmtPct(m.delayed1Pct)+' of released',m.delayed1?'warn':'good')}${kpi('Total PO amount',fmtAmt(m.totalAmount),'Reported values; no FX conversion')}</div><div class="grid panel-grid"><section class="card"><h2>Monthly Released PO Trend</h2>${renderChart(region.monthly)}</section><section class="card"><h2>Delay Aging</h2><table><tr><th>Category</th><th>Count</th></tr><tr><td>Delayed 1+ day</td><td>${fmtNum(m.delayed1)}</td></tr><tr><td>Delayed 10-20 days</td><td>${fmtNum(m.delayed10_20)}</td></tr><tr><td>Delayed 20+ days</td><td>${fmtNum(m.delayed20)}</td></tr></table></section></div>`}
async function loadData(){try{const response=await fetch('./dashboard-data.json',{cache:'no-store'});if(!response.ok)throw new Error('Unable to load dashboard-data.json: '+response.status);DASHBOARD_DATA=await response.json();renderButtons();render()}catch(err){document.getElementById('dashboard').innerHTML=`<section class="card"><h2>Data file could not be loaded</h2><p class="note">${esc(err.message)}. Confirm dashboard-data.json is uploaded in the same GitHub folder as index.html.</p></section>`;console.error(err)}}
loadData();
</script></body></html>
