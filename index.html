<style>
:root{--bg0:#06233b;--bg1:#0b3a61;--panel:rgba(40,112,173,.62);--panel2:rgba(19,76,128,.78);--line:rgba(147,205,255,.22);--text:#eaf7ff;--muted:#9fc4dd;--blue:#52c7ff;--blue2:#5977ff;--green:#72e06a;--lime:#c8f23a;--yellow:#ffd12f;--orange:#ff9f1c;--red:#ff5c7a;--shadow:0 20px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 28% 12%,#1e79bb 0,#0c4778 33%,#072a49 72%,#041727 100%);color:var(--text);min-height:100vh}

main{max-width:1280px;margin:auto;padding:0 30px 38px;position:relative} .controls{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap} button{border:1px solid var(--line);background:rgba(9,38,69,.72);color:var(--text);padding:9px 14px;border-radius:999px;font-weight:700;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)} button.active{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#06233b;border-color:rgba(255,255,255,.3)}
.dashboard-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px} .left-stack,.right-stack{display:grid;gap:18px} .kpis{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:14px} .process-kpis{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:14px}
.card{background:linear-gradient(160deg,rgba(57,131,196,.62),rgba(14,57,101,.72));border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.13);padding:16px;backdrop-filter:blur(8px)} .card h2{margin:0 0 12px;font-size:17px;font-weight:750;color:#f2fbff} .card h3{margin:0 0 10px;font-size:15px;color:#dff4ff}
.kpi{min-height:118px;position:relative;overflow:hidden} .kpi:after{content:"";position:absolute;right:-30px;bottom:-35px;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,rgba(82,199,255,.22),transparent 60%)} .kpi .label{font-size:13px;color:#d7efff;margin-bottom:12px} .kpi .value{font-size:32px;font-weight:800;letter-spacing:.2px;color:#fff;text-shadow:0 4px 22px rgba(0,0,0,.2)} .kpi .sub{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35} .good{color:var(--green)} .warn{color:var(--orange)} .bad{color:var(--red)} .badge{display:inline-block;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.2);padding:5px 10px;border-radius:999px;font-weight:800;color:#fff} .note{color:var(--muted);line-height:1.45} .sourcebar{margin-bottom:14px}

<header><h1>PR to PO KPI</h1><p>Monthly procurement release metrics for USA, Canada, Saudi, and Dubai.</p></header>
<main><div class="controls" id="regionButtons"></div><section id="dashboard"></section>
<section class="card" style="margin-top:18px"><h2>Monthly Update Agent Instructions</h2><p class="note">Use this prompt for the agent that updates this file each month.</p><div class="agent-copy-actions"><button type="button" id="copyAgentInstructionsBtn" onclick="copyAgentInstructions()">Copy Agent Instructions</button><span id="copyAgentInstructionsStatus" class="note" aria-live="polite"></span></div><textarea id="agentInstructionsText" class="clipboard-source" readonly aria-hidden="true" tabindex="-1">You are the PR to PO KPI Data Update Agent.

I need help updating a PR to PO KPI dashboard data file.

Goal:
Create a new dashboard-data.json file that I can upload to GitHub for my PR to PO KPI website.

Important:
Do not create or modify index.html.
Do not redesign the dashboard.
Do not change layout, colors, charts, labels, tables, or JavaScript.
Only create a valid dashboard-data.json file.

I will upload files in stages.

Files involved:
1. Existing dashboard-data.json
2. USA Requisition and Purchase Order Status CSV
3. Canada Requisition and Purchase Order Status CSV
4. Dubai/UAE Requisition and Purchase Order Status CSV
5. Saudi Requisition and Purchase Order Status CSV

CSV files are valid source data.
Do not reject CSV files because they are not Excel workbooks.
If a CSV file is readable, process the CSV rows directly.

PROCESS

Step 1:
Ask me to upload the existing dashboard-data.json file.

After I upload it:
- Read and validate the JSON.
- Confirm that it contains:
- regions
- regions.USA
- regions.Canada
- regions.Dubai
- regions.Saudi
- assumptions

Step 2:
Ask me to upload the USA CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 3:
Ask me to upload the Canada CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 4:
After USA and Canada are uploaded and validated:
- Update only the USA and Canada sections in the base JSON.
- Preserve Dubai and Saudi exactly as they appeared in the original dashboard-data.json.
- Preserve the assumptions array.
- Create an interim JSON output named dashboard-data-USA-Canada.json.
- Return the interim JSON as an attached/downloadable file if possible.
- Then ask me to upload the Dubai/UAE CSV file.

Step 5:
Ask me to upload the Dubai/UAE CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 6:
Ask me to upload the Saudi CSV file.

After I upload it:
- Read the file contents.
- Find the header row by locating the row that contains both:
- Requisition #
- PO Status
- Ignore all rows above the header row.
- Validate the required columns.

Step 7:
After Dubai/UAE and Saudi are uploaded and validated:
- Use the interim JSON as the base.
- Preserve USA and Canada exactly as updated in the interim JSON.
- Update only Dubai and Saudi.
- Preserve the assumptions array.
- Create the final valid dashboard-data.json file.
- Return the final dashboard-data.json as an attached/downloadable file if possible.

REQUIRED COLUMNS

Required columns after normalization:
- Project Manager
- Requisition #
- Requisition Status
- Approval State
- Requisition Create Date
- Requisition Submit Date
- Requisition PM Approve Date
- Requisition Buyer Approve Date
- PO #
- PO Date
- PO Status
- PO Currency
- PO Total Amount
- Vendor Number
- Vendor Name

Column normalization rules:
- Remove line breaks in column names.
- Trim leading and trailing spaces.
- Replace multiple spaces with one space.

Examples:
"Requisition 
PM Approve Date" should be treated as "Requisition PM Approve Date"

"Requisition 
Buyer Approve Date" should be treated as "Requisition Buyer Approve Date"

"PO Total Amount" should be treated as "PO Total Amount"

RELEASED PO RULE

Only count rows where:
- PO Status equals Printed
- Requisition PM Approve Date is populated
- Requisition Buyer Approve Date is populated

Do not count rows where PO Status is:
- Cancelled
- Changed
- Approved
- Blank
- Anything other than Printed

DATE AND TIME RULES

The PR/PO source files may contain date-only values instead of date/time values.

If a date field has no time value:
- Treat the date as midnight at the start of that calendar day.
- Still calculate business time based on business calendar days.
- Do not reject the row only because time-of-day is missing.

Business hours are calculated from:
- Requisition PM Approve Date
to:
- Requisition Buyer Approve Date

Use PO Date only for monthly grouping.
Do not use PO Date to calculate buyer delay.

BUSINESS CALENDAR RULES

Calculate business hours using the region-specific weekend and holiday calendar.

Exclude:
- Weekend days for that region
- Public holidays for that region

If the start date and end date are the same business day:
- Business hours may be less than 24
- Delay days should be 0

Delay days = INT(business hours / 24)

Same Day = delay days 0.
Delayed 1+ day = delay days greater than or equal to 1.
Delayed 10-20 days = delay days between 10 and 20 inclusive.
Delayed 20+ days = delay days greater than 20.

Do not convert currencies.
Total PO amount is the reported PO Total Amount sum from the source file.

WEEKEND RULES BY REGION

Use these weekend exclusions:

USA:
- Saturday
- Sunday

Canada:
- Saturday
- Sunday

Dubai:
- Saturday
- Sunday

Saudi:
- Friday
- Saturday

HOLIDAY RULES

Use this holiday priority:

1. If the uploaded base dashboard-data.json already contains a holiday list or configured calendar for a region, use that existing region-specific holiday list.
2. If the base JSON does not contain a holiday list, use the 2026 holiday lists below.
3. Do not invent holidays.
4. Do not add state, provincial, or company holidays unless they already exist in the base JSON or I provide them.

For all holiday matching:
- Treat holiday dates as full non-business days.
- Exclude them from business-hour calculations.
- If a holiday falls on a weekend, do not double count it.
- Count holidays in calendarNote as the number of holiday dates used for that region.

USA 2026 HOLIDAYS

Use these USA holiday dates if no existing USA holiday list is available in the base JSON:

- 2026-01-01 New Year's Day
- 2026-01-19 Martin Luther King Jr. Day
- 2026-02-16 Washington's Birthday / Presidents Day
- 2026-05-25 Memorial Day
- 2026-06-19 Juneteenth National Independence Day
- 2026-07-03 Independence Day observed
- 2026-09-07 Labor Day
- 2026-10-12 Columbus Day
- 2026-11-11 Veterans Day
- 2026-11-26 Thanksgiving Day
- 2026-12-25 Christmas Day

USA calendarNote format:
"Weekends excluded: Sat, Sun; Holidays excluded: 11 dates"

CANADA 2026 HOLIDAYS

Use these Canada holiday dates if no existing Canada holiday list is available in the base JSON:

- 2026-01-01 New Year's Day
- 2026-04-03 Good Friday
- 2026-04-06 Easter Monday
- 2026-05-18 Victoria Day
- 2026-07-01 Canada Day
- 2026-08-03 Civic Holiday
- 2026-09-07 Labour Day
- 2026-09-30 National Day for Truth and Reconciliation
- 2026-10-12 Thanksgiving Day
- 2026-11-11 Remembrance Day
- 2026-12-25 Christmas Day
- 2026-12-26 Boxing Day

Do not include Quebec-only Saint-Jean-Baptiste Day unless the base JSON already includes it or I specifically ask for it.

Canada calendarNote format:
"Weekends excluded: Sat, Sun; Holidays excluded: 12 dates"

DUBAI / UAE 2026 HOLIDAYS

Use these Dubai/UAE holiday dates if no existing Dubai/UAE holiday list is available in the base JSON.

Because some UAE Islamic holiday dates depend on official moon sighting, use the base JSON dates first if available. If no base dates are available, use this 2026 working holiday list:

- 2026-01-01 New Year's Day
- 2026-03-19 Eid Al Fitr holiday
- 2026-03-20 Eid Al Fitr
- 2026-03-21 Eid Al Fitr holiday
- 2026-03-22 Eid Al Fitr holiday
- 2026-05-26 Arafat Day
- 2026-05-27 Eid Al Adha
- 2026-05-28 Eid Al Adha holiday
- 2026-05-29 Eid Al Adha holiday
- 2026-06-15 Islamic New Year
- 2026-08-24 Prophet Muhammad's Birthday observed
- 2026-12-02 UAE National Day
- 2026-12-03 UAE National Day

Dubai calendarNote format:
"Weekends excluded: Sat, Sun; Holidays excluded: 13 dates"

SAUDI 2026 HOLIDAYS

Use these Saudi holiday dates if no existing Saudi holiday list is available in the base JSON.

Because some Saudi Islamic holiday dates depend on official moon sighting, use the base JSON dates first if available. If no base dates are available, use this 2026 working holiday list:

- 2026-02-22 Founding Day
- 2026-03-19 Eid Al Fitr holiday
- 2026-03-20 Eid Al Fitr
- 2026-03-21 Eid Al Fitr holiday
- 2026-03-22 Eid Al Fitr holiday
- 2026-05-26 Arafat Day
- 2026-05-27 Eid Al Adha
- 2026-05-28 Eid Al Adha holiday
- 2026-05-29 Eid Al Adha holiday
- 2026-09-23 Saudi National Day

Do not include Ramadan Begins, Flag Day, Muharram, equinoxes, or solstices as business holidays unless the base JSON already includes them or I specifically provide them.

Saudi calendarNote format:
"Weekends excluded: Fri, Sat; Holidays excluded: 10 



Return only the updated dashboard-data.json file.</textarea></section>

<script>
function copyAgentInstructions(){const source=document.getElementById('agentInstructionsText');const status=document.getElementById('copyAgentInstructionsStatus');const text=source.value;const done=()=>{status.textContent='Copied to clipboard.';setTimeout(()=>{status.textContent=''},2500)};const failed=()=>{status.textContent='Copy failed. Select the button again or copy from the source file.'};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(source,done,failed));}else{fallbackCopy(source,done,failed);}}
function fallbackCopy(source,done,failed){try{source.focus();source.select();source.setSelectionRange(0,source.value.length);const ok=document.execCommand('copy');window.getSelection().removeAllRanges();ok?done():failed();}catch(err){failed();}}
let DASHBOARD_DATA; const order=['USA','Canada','Saudi','Dubai']; let current='USA';
function n(v){return Number(v||0)} function fmtNum(v){return n(v).toLocaleString()} function fmtAmt(v){return n(v).toLocaleString(undefined,{maximumFractionDigits:0})} function fmtPct(v){return (n(v)*100).toFixed(1)+'%'} function fmtAvg(v){return n(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} function fmtDays(v){return fmtAvg(v)+' days'} function metricValue(region,key,fallback){return region.metrics&&region.metrics[key]!==undefined?region.metrics[key]:fallback} function monthValue(m,key,fallback){return m&&m[key]!==undefined?m[key]:fallback}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderButtons(){const box=document.getElementById('regionButtons');box.innerHTML='';order.forEach(r=>{const b=document.createElement('button');b.textContent=r;b.className=r===current?'active':'';b.onclick=()=>{current=r;renderButtons();render()};box.appendChild(b)})}
function kpi(label,value,sub,cls=''){return `<div class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`}
function renderGauge(region){const m=region.metrics;const same=Math.min(100,Math.max(0,n(m.sameDayPct)*100));const delayed=Math.min(100,Math.max(0,n(m.delayed1Pct)*100));const prAvg=metricValue(region,'avgPRRowsWithPOPerBusinessDay',0);const r=108,c=2*Math.PI*r;const sameDash=(same/100)*c;const delayDash=(delayed/100)*c;return `<section class="card hero"><div class="gauge-wrap"><svg viewBox="0 0 260 260"><circle class="gauge-track" cx="130" cy="130" r="108"></circle><circle class="gauge-main gauge-green" cx="130" cy="130" r="108" stroke-dasharray="${sameDash} ${c-sameDash}"></circle><circle class="gauge-main gauge-blue" cx="130" cy="130" r="82" stroke-dasharray="${(prAvg/Math.max(1,prAvg+5))*2*Math.PI*82} ${2*Math.PI*82}"></circle><circle class="gauge-main gauge-yellow" cx="130" cy="130" r="56" stroke-dasharray="${delayDash/100*2*Math.PI*56} ${2*Math.PI*56}"></circle></svg><div class="gauge-center"><div class="note">Same-Day Release</div><div class="big">${same.toFixed(1)}%</div><div class="small">${fmtAvg(prAvg)} PRs/day</div></div></div></section>`}
function renderChart(months){const max=Math.max(1,...months.map(m=>monthValue(m,'totalPRRowsWithPO',m.released)));return `<div class="chart">${months.map(m=>{const count=monthValue(m,'totalPRRowsWithPO',m.released);const avg=m.avgPRRowsWithPOPerBusinessDay??(m.businessDays?count/m.businessDays:null);const avgText=avg===null?'':`<small>${fmtAvg(avg)}/day</small>`;return `<div class="barwrap"><div class="bar" style="height:${Math.max(4,count/max*206)}px"><span>${fmtNum(count)}${avgText}</span></div><div class="barlabel">${esc(m.month.slice(0,3))}</div></div>`}).join('')}</div>`}
function trendPoints(months,key,maxVal,w,h,pad){const denom=Math.max(1,months.length-1);return months.map((m,i)=>{const x=pad+(i/denom)*(w-pad*2);const y=h-pad-(n(m[key])/maxVal)*(h-pad*2);return {x,y,v:n(m[key]),month:m.month}})}
function polyline(points){return points.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}
function renderProcessTrend(months){const w=760,h=270,pad=42;const maxVal=Math.max(1,...months.flatMap(m=>[n(m.avgCreateToPmDays),n(m.avgPmToBuyerDays),n(m.avgCreateToBuyerDays)]));const cpm=trendPoints(months,'avgCreateToPmDays',maxVal,w,h,pad);const pmb=trendPoints(months,'avgPmToBuyerDays',maxVal,w,h,pad);const total=trendPoints(months,'avgCreateToBuyerDays',maxVal,w,h,pad);const ticks=[0,.25,.5,.75,1].map(t=>{const y=h-pad-t*(h-pad*2);const val=maxVal*t;return `<line class="trend-axis" x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}"></line><text class="trend-label" x="5" y="${y+4}">${fmtAvg(val)}</text>`}).join('');const labels=months.map((m,i)=>{const x=pad+(i/Math.max(1,months.length-1))*(w-pad*2);return `<text class="trend-label" x="${x-14}" y="${h-10}">${esc(m.month.slice(0,3))}</text>`}).join('');const dots=(pts,color)=>pts.map(p=>`<circle class="trend-dot" cx="${p.x}" cy="${p.y}" r="4" fill="${color}"><title>${esc(p.month)}: ${fmtDays(p.v)}</title></circle>`).join('');return `<div class="process-trend"><h3>Monthly Process Timing Trend</h3><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Monthly process timing trend in days">${ticks}<line class="trend-axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}"></line><line class="trend-axis" x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"></line><polyline class="trend-create-pm" points="${polyline(cpm)}"></polyline><polyline class="trend-pm-buyer" points="${polyline(pmb)}"></polyline><polyline class="trend-total" points="${polyline(total)}"></polyline>${dots(cpm,'#52c7ff')}${dots(pmb,'#ff9f1c')}${dots(total,'#72e06a')}${labels}</svg><div class="trend-legend"><span><i class="legend-swatch" style="background:#52c7ff"></i>PR Created to PM Approval</span><span><i class="legend-swatch" style="background:#ff9f1c"></i>PM Approval to PO Created</span><span><i class="legend-swatch" style="background:#72e06a"></i>Total Time from PR Creation to PO</span></div></div>`}
function renderDelayed(rows){if(!rows.length)return '<p class="note">No delayed 1+ day PR to PO releases found for this data set.</p>';return `<div class="table-scroll"><table><thead><tr><th>PO #</th><th>PO Date</th><th>Req #</th><th>Project Manager</th><th>Vendor</th><th>Delay Days</th><th>Business Hours</th><th>PM Approve</th><th>Buyer Approve</th><th>Amount</th><th>Curr</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.po)}</td><td>${esc(r.poDate||'')}</td><td>${esc(r.req)}</td><td>${esc(r.manager)}</td><td>${esc(r.vendor)}</td><td class="bad">${fmtNum(r.delay)}</td><td>${n(r.hours).toFixed(2)}</td><td>${esc(r.pmApproveDate||'')}</td><td>${esc(r.buyerApproveDate||'')}</td><td>${'$'+fmtAmt(r.amount)}</td><td>${esc(r.currency)}</td></tr>`).join('')}</tbody></table></div>`}
function render(){const region=DASHBOARD_DATA.regions[current];const dash=document.getElementById('dashboard');const m=region.metrics;const prTotal=metricValue(region,'totalPRRowsWithPO',m.released);const prAvg=metricValue(region,'avgPRRowsWithPOPerBusinessDay',null);const prDays=metricValue(region,'totalPRRowsWithPOBusinessDays',null);const prSub=prAvg===null?'Rows where PO # is populated':fmtAvg(prAvg)+'/day'+(prDays?' over '+fmtNum(prDays)+' workdays':'');const delayedRows=region.allDelayed||region.topDelayed||[];dash.innerHTML=`<div class="sourcebar"><span class="badge">${esc(current)}</span> <span class="note"> Source: ${esc(region.fileName)} | Updated: ${esc(region.generatedAt)} | ${esc(region.calendarNote)} | Currencies: ${esc(region.currencyNote)}</span></div><div class="dashboard-grid"><div class="left-stack"><div class="kpis">${kpi('PR total',fmtNum(prTotal),prSub)}${kpi('Same-day release',fmtPct(m.sameDayPct),fmtNum(m.sameDay)+' of '+fmtNum(m.released),'good')}${kpi('Delayed 1+ day',fmtNum(m.delayed1),fmtPct(m.delayed1Pct)+' of released',m.delayed1?'warn':'good')}${kpi('Total PO amount','$'+fmtAmt(m.totalAmount),'Year to Date')}</div>${renderGauge(region)}<section class="card"><h2>Monthly PR Rows With PO # Trend</h2>${renderChart(region.monthly)}</section></div><div class="right-stack"><section class="card"><h2>Approval Process Timing</h2><p class="note">Average calendar days for released POs with all process milestone dates populated.</p><div class="process-kpis">${kpi('PR Created to PM Approval',fmtDays(metricValue(region,'avgCreateToPmDays',0)),fmtNum(metricValue(region,'processTimingCount',0))+' POs measured')}${kpi('PM Approval to PO Created',fmtDays(metricValue(region,'avgPmToBuyerDays',0)),'Average calendar days')}${kpi('Total Time from PR Creation to PO',fmtDays(metricValue(region,'avgCreateToBuyerDays',0)),'Total process average')}</div>${renderProcessTrend(region.monthly)}</section><section class="card"><h2>Delay Aging</h2><table><tr><th>Category</th><th>Count</th></tr><tr><td>Delayed 1+ day</td><td>${fmtNum(m.delayed1)}</td></tr><tr><td>Delayed 10-20 days</td><td>${fmtNum(m.delayed10_20)}</td></tr><tr><td>Delayed 20+ days</td><td>${fmtNum(m.delayed20)}</td></tr></table></section></div></div><section class="card" style="margin-top:18px"><h2>POs Delayed 1+ Business Day</h2><p class="note">Printed POs where buyer approval occurred one or more business days after PM approval.</p>${renderDelayed(delayedRows)}</section>`}
async function loadData(){try{const response=await fetch('./dashboard-data.json',{cache:'no-store'});if(!response.ok)throw new Error('Unable to load dashboard-data.json: '+response.status);DASHBOARD_DATA=await response.json();renderButtons();render()}catch(err){document.getElementById('dashboard').innerHTML=`<section class="card"><h2>Data file could not be loaded</h2><p class="note">${esc(err.message)}. Confirm dashboard-data.json is uploaded in the same GitHub folder as index.html.</p></section>`;console.error(err)}}
loadData();
</script></body></html>
